<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neelu ❤️</title>
<style>
body{margin:0;overflow-x:hidden;font-family:Arial,sans-serif;color:white;text-align:center;background:#111;}
#lockScreen{
height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
background:linear-gradient(135deg,#ffb6d9,#ffd6eb,#ffe7f5);
}
.lock-image{
width:180px;height:180px;border-radius:50%;border:5px solid white;
object-fit:cover;margin-bottom:20px;box-shadow:0 0 30px rgba(255,255,255,.6);
}
.emoji-container span{
position:fixed;font-size:28px;animation:float 12s linear infinite;z-index:-1;
}
.emoji-container span:nth-child(1){left:5%;animation-delay:0s;}
.emoji-container span:nth-child(2){left:20%;animation-delay:2s;}
.emoji-container span:nth-child(3){left:40%;animation-delay:4s;}
.emoji-container span:nth-child(4){left:60%;animation-delay:1s;}
.emoji-container span:nth-child(5){left:80%;animation-delay:3s;}
.emoji-container span:nth-child(6){left:90%;animation-delay:5s;}
@keyframes float{0%{transform:translateY(100vh);}100%{transform:translateY(-120vh);}}

.bg-slideshow{
position:fixed;inset:0;z-index:-3;background-size:cover;background-position:center;
animation:slideShow 30s infinite;
}
@keyframes slideShow{
0%{background-image:url('PHOTO1.jpg')}
20%{background-image:url('PHOTO2.jpg')}
40%{background-image:url('PHOTO3.jpg')}
60%{background-image:url('PHOTO4.jpg')}
80%{background-image:url('PHOTO5.jpg')}
100%{background-image:url('PHOTO1.jpg')}
}
.bg-slideshow::after{
content:'';position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);
}

.glass-card{
background:rgba(255,255,255,.15);backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.3);padding:30px;border-radius:30px;
box-shadow:0 20px 50px rgba(0,0,0,.3);margin:30px auto;width:300px;
}

.gallery{
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;padding:30px;
}
.polaroid{
background:white;padding:12px;border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}
.polaroid img{width:100%;height:250px;object-fit:cover;}
.polaroid p{color:black;}

.wish{
font-size:20px;font-weight:bold;margin:10px;
}
button{padding:10px 20px;font-size:16px;cursor:pointer;}
</style>
</head>
<body>

<div id="lockScreen">
  <img src="LOCK_IMAGE.jpg" class="lock-image">
  <h1>🔒 Enter Password</h1>
  <input type="password" id="password" placeholder="Password">
  <button onclick="unlock()">Open</button>
</div>

<div id="website" style="display:none">
<div class="bg-slideshow"></div>

<div class="emoji-container">
<span>💖</span><span>💕</span><span>💗</span><span>💞</span><span>🌸</span><span>🎈</span>
</div>

<div class="glass-card">
<h2>Neelu ❤️</h2>
<p>Best Friends Forever</p>
</div>

<h2>Memories</h2>

<div class="gallery">
<div class="polaroid"><img src="1.jpg"><p>Photo 1</p></div>
<div class="polaroid"><img src="2.jpg"><p>Photo 2</p></div>
<div class="polaroid"><img src="3.jpg"><p>Photo 3</p></div>
<div class="polaroid"><img src="4.jpg"><p>Photo 4</p></div>
<div class="polaroid"><img src="5.jpg"><p>Photo 5</p></div>
<div class="polaroid"><img src="6.jpg"><p>Photo 6</p></div>
<div class="polaroid"><img src="7.jpg"><p>Photo 7</p></div>
<div class="polaroid"><img src="8.jpg"><p>Photo 8</p></div>
<div class="polaroid"><img src="9.jpg"><p>Photo 9</p></div>
<div class="polaroid"><img src="10.jpg"><p>Photo 10</p></div>
</div>

<button onclick="celebrate()">🎉 Celebrate</button>

<div class="wish">✨ Best Friends Forever ✨</div>
<div class="wish">💖 Always Smile Neelu 💖</div>
<div class="wish">🌸 Stay Happy 🌸</div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>
</div>

<script>
const PASSWORD="neelu";
function unlock(){
 if(document.getElementById("password").value===PASSWORD){
   document.getElementById("lockScreen").style.display="none";
   document.getElementById("website").style.display="block";
   document.getElementById("bgMusic").play().catch(()=>{});
 }else{
   alert("Wrong Password");
 }
}

function celebrate(){
for(let i=0;i<200;i++){
 let conf=document.createElement("div");
 conf.innerHTML=["🎉","✨","💖","🌸"][Math.floor(Math.random()*4)];
 conf.style.position="fixed";
 conf.style.left=Math.random()*100+"vw";
 conf.style.top="-20px";
 conf.style.fontSize="25px";
 document.body.appendChild(conf);
 conf.animate(
 [{transform:"translateY(0) rotate(0deg)"},{transform:"translateY(110vh) rotate(720deg)"}],
 {duration:4000}
 );
 setTimeout(()=>conf.remove(),4000);
}
}
</script>

</body>
</html>
